{% extends 'plantilla/base.html' %}
{% block main %}
<main id="main" class="main">

  <div class="pagetitle">
    <h1><i class="bi bi-cash-coin me-2"></i>Auditoría de Cajas</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'cpanel' %}">Home</a></li>
        <li class="breadcrumb-item">Auditorías</li>
        <li class="breadcrumb-item active">Cajas</li>
      </ol>
    </nav>
  </div>

  <section class="section">
    <div class="card shadow-sm border-0">
      <div class="card-body">

        <h5 class="card-title d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
          <span>Historial de Auditoría — Cajas</span>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <input type="date" id="filtro-fecha-inicio" class="form-control form-control-sm" style="width:auto;" title="Desde">
            <input type="date" id="filtro-fecha-fin" class="form-control form-control-sm" style="width:auto;" title="Hasta">
            <input type="text" id="filtro-usuario" class="form-control form-control-sm" placeholder="Usuario..." style="width:160px;">
            <button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="limpiarFiltros()">
              <i class="bi bi-x-circle me-1"></i>Limpiar
            </button>
          </div>
        </h5>

        <div id="alerta-error-ajax" class="alert alert-danger d-none" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <strong>Error al cargar datos:</strong> <span id="mensaje-error-ajax"></span>
        </div>

        <div class="table-responsive">
          <table id="tablaAuditoria" class="table table-hover align-middle" style="width:100%">
            <thead class="table-dark">
              <tr>
                <th>#ID</th>
                <th>Caja</th>
                <th>Acción</th>
                <th>Motivo</th>
                <th>Detalles</th>
                <th>Usuario</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </div>
  </section>

</main>
{% endblock %}

{% block extra_scripts %}
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

<script>
var tabla;
function badgeAccion(accion) {
  var a = (accion || '').toUpperCase();
  if (a.includes('APERT')) return '<span class="badge bg-success">' + accion + '</span>';
  if (a.includes('CIERR')) return '<span class="badge bg-danger">' + accion + '</span>';
  if (a.includes('MOV'))   return '<span class="badge bg-warning text-dark">' + accion + '</span>';
  return '<span class="badge bg-secondary">' + accion + '</span>';
}
$(document).ready(function () {
  const hoy = new Date();
  const primerDiaMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  const formatDate = (d) => {
    let mes = '' + (d.getMonth() + 1), dia = '' + d.getDate(), anio = d.getFullYear();
    if (mes.length < 2) mes = '0' + mes;
    if (dia.length < 2) dia = '0' + dia;
    return [anio, mes, dia].join('-');
  };
  $('#filtro-fecha-inicio').val(formatDate(primerDiaMes));
  $('#filtro-fecha-fin').val(formatDate(hoy));

  tabla = $('#tablaAuditoria').DataTable({
    serverSide: true, processing: true, pageLength: 10, lengthMenu: [10, 25, 50],
    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.7/i18n/es-ES.json' },
    ajax: {
      url: "{% url 'auditorias_cajas_json' %}",
      data: function (d) {
        d.fecha_inicio = $('#filtro-fecha-inicio').val();
        d.fecha_fin    = $('#filtro-fecha-fin').val();
        d.usuario      = $('#filtro-usuario').val();
      },
      error: function (xhr, error, thrown) {
        $('#alerta-error-ajax').removeClass('d-none');
        $('#mensaje-error-ajax').text('HTTP ' + xhr.status + ' — ' + (thrown || error));
        console.error('DataTables AJAX error:', xhr.status, xhr.responseText);
      }
    },
    columns: [
      { data: 'id',     width: '60px' },
      { data: 'caja' },
      { data: 'accion', render: function(d) { return badgeAccion(d); } },
      { data: 'motivo' },
      { data: 'detalles' },
      { data: 'usuario' },
      { data: 'fecha' }
    ],
    order: [[6, 'desc']],
  });

  // Autofiltrado al cambiar fechas o escribir usuario
  $('#filtro-fecha-inicio, #filtro-fecha-fin').on('change', reloadTable);
  $('#filtro-usuario').on('keyup', function() {
    clearTimeout($.data(this, 'timer'));
    var wait = setTimeout(reloadTable, 500);
    $(this).data('timer', wait);
  });
});
function reloadTable() { $('#alerta-error-ajax').addClass('d-none'); tabla.ajax.reload(); }
function limpiarFiltros() { $('#filtro-fecha-inicio,#filtro-fecha-fin,#filtro-usuario').val(''); $('#alerta-error-ajax').addClass('d-none'); tabla.ajax.reload(); }
</script>
{% endblock %}
