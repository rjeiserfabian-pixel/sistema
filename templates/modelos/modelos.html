{% extends 'plantilla/base.html' %}
{% block main %}
<main id="main" class="main">

  <!-- Encabezado -->
  <div class="pagetitle d-flex justify-content-between align-items-center">
    <div>
      <h1 class="fw-bold text-primary">
        <i class="fas fa-layer-group me-2"></i>Modelos de Vehículo
      </h1>
      <nav aria-label="breadcrumb" class="mt-1">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'cpanel' %}">Home</a></li>
          <li class="breadcrumb-item active">Modelos</li>
        </ol>
      </nav>
    </div>
    <button type="button" class="btn btn-success rounded-pill shadow-sm px-4"
      data-bs-toggle="modal" data-bs-target="#myModalAgregar">
      <i class="fa-solid fa-circle-plus me-2"></i>Agregar Modelo
    </button>
  </div>

  <!-- Tabla principal -->
  <section class="section dashboard mt-4">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h5 class="card-title">Listado de modelos registrados</h5>
        <div class="table-responsive">
          <table id="tabla-modelos" class="table table-hover align-middle" style="width:100%;">
            <thead class="table-dark">
              <tr>
                <th style="width: 60px;" class="text-center">#</th>
                <th>Modelo</th>
                <th style="width: 120px;" class="text-center" data-sortable="false">Acciones</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- Modal de Edición Único -->
  <div class="modal fade" id="modalEditarDinamico" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 shadow-lg border-0">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">
            <i class="fa-solid fa-pen-to-square me-2"></i>Editar Modelo
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <label class="form-label fw-semibold">Nombre del Modelo <span class="text-danger">*</span></label>
          <input type="hidden" id="id_modelo_dinamico">
          <input type="text" class="form-control rounded-pill" id="nombre_modelo_dinamico" maxlength="100"
            placeholder="Ej: Civic, NMAX, Hilux...">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary rounded-pill px-4" id="btnGuardarEditarDinamico">
            <i class="fa-solid fa-floppy-disk me-1"></i>Guardar
          </button>
          <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Agregar -->
  <div class="modal fade" id="myModalAgregar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 shadow-lg border-0">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title fw-bold">
            <i class="fa-solid fa-circle-plus me-2"></i>Agregar Modelo
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <label class="form-label fw-semibold">Nombre del Modelo <span class="text-danger">*</span></label>
          <input type="text" id="nombreModeloAgregar" class="form-control rounded-pill" maxlength="100"
            placeholder="Ej: Civic, NMAX, Hilux...">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success rounded-pill px-4" id="btnAgregar">
            <i class="fa-solid fa-circle-plus me-1"></i>Agregar
          </button>
          <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

</main>

<style>
  #tabla-modelos thead th {
    background-color: #212529 !important;
    color: #fff !important;
    font-weight: 600;
    vertical-align: middle;
    border: none;
    padding: 12px 8px !important;
    text-align: center !important;
  }
  #tabla-modelos thead th:nth-child(2) {
    text-align: left !important;
  }
  /* Quitar espacio de iconos de ordenamiento en columnas no ordenables */
  #tabla-modelos thead th[data-sortable="false"] {
    padding-right: 8px !important;
  }
  #tabla-modelos thead th[data-sortable="false"]::after,
  #tabla-modelos thead th[data-sortable="false"]::before {
    display: none !important;
  }
  #tabla-modelos tbody td {
    vertical-align: middle;
    padding: 10px 8px;
    font-size: 0.875rem;
  }
  /* Forzar centrado en columnas específicas */
  #tabla-modelos thead th:first-child,
  #tabla-modelos tbody td:first-child,
  #tabla-modelos thead th:last-child,
  #tabla-modelos tbody td:last-child {
    text-align: center !important;
  }
  #tabla-modelos thead th:nth-child(2),
  #tabla-modelos tbody td:nth-child(2) {
    text-align: left !important;
  }
  #tabla-modelos tbody tr:hover { background-color: #f8f9fa; }
  .modal-content { overflow: hidden; }
  .form-control { padding: 0.6rem 1.2rem; }
  .form-control:focus { box-shadow: 0 0 0 0.2rem rgba(13,110,253,.15); }
  .btn-outline-primary:hover, .btn-outline-danger:hover {
    transform: scale(1.1);
    transition: transform .15s ease;
  }
</style>
{% endblock %}

{% block extra_scripts %}
<!-- DataTables Bootstrap 5 CSS & JS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

<script>
  var CSRF_TOKEN = '{{ csrf_token }}';
  var URL_AGREGAR = "{% url 'agregarModelos' %}";
  var URL_EDITAR = "{% url 'editarModelos' %}";
  var URL_LISTAR_API = "{% url 'api_listar_modelos' %}";

  $(function () {
    // ==================== DATATABLES ====================
    var tablaModelos = $('#tabla-modelos').DataTable({
      processing: true,
      serverSide: true,
      ajax: {
        url: URL_LISTAR_API,
        type: 'GET'
      },
      columns: [
        { data: 'index', className: 'text-center fw-semibold' },
        { 
          data: 'nombremodelo',
          render: function (data, type, row) {
            return '<span class="badge bg-primary me-2"><i class="fa-solid fa-layer-group"></i></span> ' + data;
          }
        },
        { 
          data: null,
          className: 'text-center',
          orderable: false,
          render: function (data, type, row) {
            return `
              <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-sm btn-outline-primary shadow-sm btn-abrir-editar"
                  style="border-radius:8px; width:36px; height:36px;"
                  data-id="${row.idmodelo}" data-nombre="${row.nombremodelo}" title="Editar">
                  <i class="fa-solid fa-pen-to-square" style="font-size:1rem;"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger shadow-sm btn-eliminar"
                  style="border-radius:8px; width:36px; height:36px;"
                  data-id="${row.idmodelo}" title="Eliminar">
                  <i class="fa-solid fa-trash" style="font-size:1rem;"></i>
                </button>
              </div>
            `;
          }
        }
      ],
      pagingType: 'simple_numbers',
      language: {
        "processing": "Procesando...",
        "lengthMenu": "Mostrar _MENU_ registros",
        "zeroRecords": "No se encontraron resultados",
        "emptyTable": "Ningún dato disponible en esta tabla",
        "info": "Mostrando registros del _START_ al _END_ de un total de _TOTAL_ registros",
        "infoEmpty": "Mostrando registros del 0 al 0 de un total de 0 registros",
        "infoFiltered": "(filtrado de un total de _MAX_ registros)",
        "search": "Buscar:",
        "loadingRecords": "Cargando...",
        "paginate": {
          "first": "Primero",
          "last": "Último",
          "next": "Siguiente",
          "previous": "Anterior"
        }
      }
    });

    // ==================== AGREGAR ====================
    $('#btnAgregar').on('click', function () {
      var nombre = $('#nombreModeloAgregar').val().trim();
      if (!nombre) {
        Swal.fire({ title: 'Campo requerido', text: 'Ingrese el nombre del modelo.', icon: 'warning' });
        return;
      }
      $.post(URL_AGREGAR, { nameModeloAgregar: nombre, csrfmiddlewaretoken: CSRF_TOKEN })
        .done(function () {
          Swal.fire({ title: '¡Agregado!', text: 'Modelo registrado correctamente.', icon: 'success' });
          $('#myModalAgregar').modal('hide');
          tablaModelos.ajax.reload(null, false);
        })
        .fail(function (xhr) {
          Swal.fire({ title: 'Error', text: 'No se pudo agregar el modelo.', icon: 'error' });
        });
    });

    $('#myModalAgregar').on('hidden.bs.modal', function () {
      $('#nombreModeloAgregar').val('');
    });

    // ==================== ABRIR MODAL EDITAR ====================
    $(document).on('click', '.btn-abrir-editar', function () {
      var id = $(this).data('id');
      var nombre = $(this).data('nombre');
      $('#id_modelo_dinamico').val(id);
      $('#nombre_modelo_dinamico').val(nombre);
      $('#modalEditarDinamico').modal('show');
    });

    // ==================== GUARDAR EDICIÓN ====================
    $('#btnGuardarEditarDinamico').on('click', function () {
      var id = $('#id_modelo_dinamico').val();
      var nombre = $('#nombre_modelo_dinamico').val().trim();
      if (!nombre) {
        Swal.fire({ title: 'Campo requerido', text: 'El nombre no puede estar vacío.', icon: 'warning' });
        return;
      }
      $.post(URL_EDITAR, { idModelo: id, nameModelo: nombre, csrfmiddlewaretoken: CSRF_TOKEN })
        .done(function () {
          Swal.fire({ title: '¡Actualizado!', text: 'Modelo actualizado correctamente.', icon: 'success' });
          $('#modalEditarDinamico').modal('hide');
          tablaModelos.ajax.reload(null, false);
        })
        .fail(function () {
          Swal.fire({ title: 'Error', text: 'No se pudo actualizar.', icon: 'error' });
        });
    });

    // ==================== ELIMINAR ====================
    $(document).on('click', '.btn-eliminar', function () {
      var id = $(this).data('id');
      Swal.fire({
        title: '¿Eliminar este modelo?',
        text: 'El modelo quedará inactivo en el sistema.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sí, eliminar',
        cancelButtonText: 'Cancelar'
      }).then(function (result) {
        if (result.isConfirmed) {
          $.post('/modelos/eliminar/' + id, { csrfmiddlewaretoken: CSRF_TOKEN })
            .done(function () {
              Swal.fire('¡Eliminado!', 'El modelo ha sido eliminado.', 'success');
              tablaModelos.ajax.reload(null, false);
            })
            .fail(function () {
              Swal.fire('Error', 'No se pudo eliminar el modelo.', 'error');
            });
        }
      });
    });

  });
</script>
{% endblock %}
