{% extends 'plantilla/base.html' %}
{% block main %}
<main id="main" class="main">
  <!-- Encabezado -->
  <div class="pagetitle d-flex justify-content-between align-items-center">
    <h1 class="fw-bold text-primary">
      <i class="fas fa-trademark me-2"></i>Marcas
    </h1>
    <button type="button" class="btn btn-success rounded-pill shadow-sm" data-bs-toggle="modal"
      data-bs-target="#myModalAgregar">
      <i class="fa-solid fa-circle-plus me-2"></i>Agregar Marca
    </button>
  </div>

  <nav aria-label="breadcrumb" class="mt-2">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'cpanel' %}">Home</a></li>
      <li class="breadcrumb-item active">Marcas</li>
    </ol>
  </nav>

  <!-- Contenido -->
  <section class="section dashboard mt-4">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h5 class="card-title">Listado de marcas</h5>

        <div class="table-responsive">
          <table id="tabla-marcas" class="table table-hover align-middle" style="width: 100%;">
            <thead class="table-dark">
              <tr>
                <th scope="col" style="width: 10%;">#</th>
                <th scope="col" style="width: 70%;">Marca</th>
                <th scope="col" class="text-center" style="width: 20%;">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- DataTables llenará esto -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- Modal Dinámico de Edición -->
  <div class="modal fade" id="modalEditarDinamico" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 shadow-lg">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fa-solid fa-pen-to-square me-2"></i>Editar Marca</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editMarcaId">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre de la Marca <span class="text-danger">*</span></label>
            <input type="text" id="editMarcaNombre" class="form-control rounded-pill" maxlength="100"
              placeholder="Ej: Honda, Yamaha...">
          </div>
          <div class="modal-footer px-0 pb-0">
            <button type="button" class="btn btn-primary rounded-pill px-4 btn-guardar-editar">
              <i class="fa-solid fa-floppy-disk me-1"></i>Guardar
            </button>
            <button type="button" class="btn btn-outline-secondary rounded-pill"
              data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Agregar -->
  <div class="modal fade" id="myModalAgregar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 shadow-lg">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title"><i class="fa-solid fa-circle-plus me-2"></i>Agregar Marca</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre de la Marca <span class="text-danger">*</span></label>
            <input type="text" id="nombreMarcaAgregar" class="form-control rounded-pill" maxlength="100"
              placeholder="Ej: Honda, Yamaha...">
          </div>
          <div class="modal-footer px-0 pb-0">
            <button type="button" class="btn btn-success rounded-pill px-4" id="btnAgregar">
              <i class="fa-solid fa-circle-plus me-1"></i>Agregar
            </button>
            <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">

<script>
  var CSRF_TOKEN = '{{ csrf_token }}';
  var URL_AGREGAR = "{% url 'agregarMarcas' %}";
  var URL_EDITAR = "{% url 'editarMarcas' %}";
  var URL_LISTA = "{% url 'marcas' %}";
  var URL_LISTAR_API = "{% url 'api_listar_marcas' %}";

  $(function () {

    // Inicializar DataTables Server-Side
    var tablaMarcas = $('#tabla-marcas').DataTable({
      processing: true,
      serverSide: true,
      ajax: {
        url: URL_LISTAR_API,
        type: 'GET'
      },
      columns: [
        { data: 'index', className: 'text-center fw-semibold' },
        { 
          data: 'nombremarca',
          render: function(data) {
            return '<span class="badge bg-secondary me-2"><i class="fa-solid fa-tag"></i></span> ' + data;
          }
        },
        { 
          data: null,
          className: 'text-center',
          orderable: false,
          render: function (data, type, row) {
            return `
              <button type="button" class="btn btn-sm btn-outline-primary me-1 btn-abrir-editar" 
                data-id="${row.idmarca}" data-nombre="${row.nombremarca}" title="Editar">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar"
                data-id="${row.idmarca}" title="Eliminar">
                <i class="fa-solid fa-trash"></i>
              </button>
            `;
          }
        }
      ],
      pagingType: 'simple_numbers',
      language: {
        "processing": "Procesando...",
        "lengthMenu": "Mostrar _MENU_ registros",
        "zeroRecords": "No se encontraron resultados",
        "emptyTable": "Ningún dato disponible en esta tabla",
        "info": "Mostrando registros del _START_ al _END_ de un total de _TOTAL_ registros",
        "infoEmpty": "Mostrando registros del 0 al 0 de un total de 0 registros",
        "infoFiltered": "(filtrado de un total de _MAX_ registros)",
        "search": "Buscar:",
        "loadingRecords": "Cargando...",
        "paginate": {
          "first": "Primero",
          "last": "Último",
          "next": "Siguiente",
          "previous": "Anterior"
        }
      }
    });

    // ==================== AGREGAR ====================
    $('#btnAgregar').on('click', function () {
      var nombre = $('#nombreMarcaAgregar').val().trim();
      if (!nombre) {
        Swal.fire({ title: 'Campo requerido', text: 'Ingrese el nombre de la marca.', icon: 'warning', confirmButtonText: 'OK' });
        return;
      }
      $.post(URL_AGREGAR, { nameMarcaAgregar: nombre, csrfmiddlewaretoken: CSRF_TOKEN })
        .done(function () {
          $('#myModalAgregar').modal('hide');
          tablaMarcas.ajax.reload(null, false);
          Swal.fire({ title: '¡Agregado!', text: 'Marca registrada correctamente.', icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
        })
        .fail(function (xhr) {
          var msg = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error : 'Error código: ' + xhr.status;
          Swal.fire({ title: 'Error', text: msg, icon: 'error', confirmButtonText: 'OK' });
        });
    });

    $('#myModalAgregar').on('hidden.bs.modal', function () {
      $('#nombreMarcaAgregar').val('');
    });

    // ==================== EDITAR ====================
    // Abrir Modal de Edición
    $(document).on('click', '.btn-abrir-editar', function() {
      var id = $(this).data('id');
      var nombre = $(this).data('nombre');
      
      $('#editMarcaId').val(id);
      $('#editMarcaNombre').val(nombre);
      $('#modalEditarDinamico').modal('show');
    });

    // Guardar Edición
    $('.btn-guardar-editar').on('click', function () {
      var id = $('#editMarcaId').val();
      var nombre = $('#editMarcaNombre').val().trim();
      
      if (!nombre) {
        Swal.fire({ title: 'Campo requerido', text: 'Ingrese el nombre de la marca.', icon: 'warning', confirmButtonText: 'OK' });
        return;
      }
      
      $.post(URL_EDITAR, { idMarca: id, nameMarca: nombre, csrfmiddlewaretoken: CSRF_TOKEN })
        .done(function () {
          $('#modalEditarDinamico').modal('hide');
          tablaMarcas.ajax.reload(null, false);
          Swal.fire({ title: '¡Actualizado!', text: 'Marca actualizada correctamente.', icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
        })
        .fail(function (xhr) {
          var msg = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error : 'Error código: ' + xhr.status;
          Swal.fire({ title: 'Error', text: msg, icon: 'error', confirmButtonText: 'OK' });
        });
    });

    // ==================== ELIMINAR ====================
    $(document).on('click', '.btn-eliminar', function () {
      var id = $(this).data('id');
      Swal.fire({
        title: '¿Eliminar esta marca?',
        text: 'La marca quedará inactiva.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Sí, eliminar',
        cancelButtonText: 'Cancelar'
      }).then(function (result) {
        if (result.isConfirmed) {
          $.post('/marcas/eliminarMarca/' + id, { csrfmiddlewaretoken: CSRF_TOKEN })
            .done(function() {
              tablaMarcas.ajax.reload(null, false);
              Swal.fire({ title: '¡Eliminado!', text: 'La marca ha sido eliminada.', icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
            })
            .fail(function(xhr) {
              Swal.fire('Error', 'No se pudo eliminar la marca.', 'error');
            });
        }
      });
    });

  });
</script>
{% endblock %}
