  <!-- Modal Agregar Servicio -->
  <div class="modal fade" id="modalAgregarServicio" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 shadow-lg">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title"><i class="fa-solid fa-circle-plus me-2"></i>Agregar Servicio / Trámite</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="formAgregarServicio">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre del Servicio <span class="text-danger">*</span></label>
              <input type="text" id="add_serv_nombre" name="nombre" class="form-control rounded-pill" maxlength="255" required placeholder="Ej. TRAMITE DE PLACA DE RODAJE">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Precio Base (S/) <span class="text-danger">*</span></label>
              <input type="number" step="0.01" min="0" id="add_serv_precio" name="precio_defecto" class="form-control rounded-pill" required placeholder="Ej. 120.00">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea id="add_serv_desc" name="descripcion" class="form-control rounded-3" rows="2" placeholder="(Opcional)"></textarea>
            </div>
            <div class="modal-footer px-0 pb-0">
              <button type="submit" class="btn btn-success rounded-pill px-4">
                <i class="fa-solid fa-circle-plus me-1"></i>Agregar
              </button>
              <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cerrar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Editar Servicio -->
  <div class="modal fade" id="modalEditarServicio" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 shadow-lg">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fa-solid fa-pen-to-square me-2"></i>Editar Servicio</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="formEditarServicio">
          <div class="modal-body">
            <input type="hidden" name="id_servicio" id="edit_serv_id">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre del Servicio <span class="text-danger">*</span></label>
              <input type="text" class="form-control rounded-pill" name="nombre" id="edit_serv_nombre" maxlength="255" required placeholder="Ej. TRAMITE DE PLACA DE RODAJE">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Precio Base (S/) <span class="text-danger">*</span></label>
              <input type="number" step="0.01" min="0" class="form-control rounded-pill" name="precio_defecto" id="edit_serv_precio" required placeholder="Ej. 120.00">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea class="form-control rounded-3" name="descripcion" id="edit_serv_desc" rows="2" placeholder="(Opcional)"></textarea>
            </div>
            <div class="modal-footer px-0 pb-0">
              <button type="submit" class="btn btn-primary rounded-pill px-4">
                <i class="fa-solid fa-floppy-disk me-1"></i>Guardar
              </button>
              <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cerrar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
